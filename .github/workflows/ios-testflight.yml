name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build and upload COP Italy for TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select a supported Xcode
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          XCODE_VERSION_OUTPUT="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION_OUTPUT"
          if [[ "$XCODE_VERSION_OUTPUT" != Xcode\ 26.* ]]; then
            echo "::error::Xcode 26 is required for App Store Connect uploads."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build the production web app
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install signing assets
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          test "$APPLE_TEAM_ID" = "S54SSM74Z5"

          SIGNING_DIR="$RUNNER_TEMP/cop-italy-ios-signing"
          CERTIFICATE_PATH="$SIGNING_DIR/distribution.p12"
          PRIVATE_KEY_PATH="$SIGNING_DIR/distribution-key.pem"
          CERTIFICATE_PEM_PATH="$SIGNING_DIR/distribution-certificate.pem"
          SIGNING_PEM_PATH="$SIGNING_DIR/distribution-identity.pem"
          PROFILE_PATH="$SIGNING_DIR/app-store.mobileprovision"
          PROFILE_PLIST="$SIGNING_DIR/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/cop-italy-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          mkdir -p "$SIGNING_DIR"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_PATH"

          if ! test -s "$CERTIFICATE_PATH"; then
            echo "::error::IOS_CERTIFICATE_P12_BASE64 decoded to an empty PKCS#12 file."
            exit 1
          fi
          CERTIFICATE_SIZE_BYTES="$(stat -f '%z' "$CERTIFICATE_PATH")"
          CERTIFICATE_SHA256="$(shasum -a 256 "$CERTIFICATE_PATH" | awk '{ print $1 }')"
          printf 'Decoded PKCS#12 size: %s bytes\n' "$CERTIFICATE_SIZE_BYTES"
          printf 'Decoded PKCS#12 SHA-256: %s\n' "$CERTIFICATE_SHA256"
          if ! openssl pkcs12 -legacy -in "$CERTIFICATE_PATH" -passin env:IOS_CERTIFICATE_PASSWORD -noout >/dev/null 2>&1; then
            echo "::error::IOS_CERTIFICATE_P12_BASE64 and IOS_CERTIFICATE_PASSWORD do not form a valid PKCS#12/password pair."
            exit 1
          fi
          echo "PKCS#12 certificate/password validation succeeded."

          if ! openssl pkcs12 -legacy -in "$CERTIFICATE_PATH" -passin env:IOS_CERTIFICATE_PASSWORD -nocerts -nodes -out "$PRIVATE_KEY_PATH" >/dev/null 2>&1; then
            echo "::error::Unable to extract the private key from the validated PKCS#12 certificate."
            exit 1
          fi
          if ! openssl pkcs12 -legacy -in "$CERTIFICATE_PATH" -passin env:IOS_CERTIFICATE_PASSWORD -clcerts -nokeys -out "$CERTIFICATE_PEM_PATH" >/dev/null 2>&1; then
            echo "::error::Unable to extract the leaf certificate from the validated PKCS#12 certificate."
            exit 1
          fi
          if ! test -s "$PRIVATE_KEY_PATH" || ! test -s "$CERTIFICATE_PEM_PATH"; then
            echo "::error::The validated PKCS#12 certificate did not produce a usable private key and leaf certificate."
            exit 1
          fi
          cat "$PRIVATE_KEY_PATH" "$CERTIFICATE_PEM_PATH" > "$SIGNING_PEM_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security import "$SIGNING_PEM_PATH" -k "$KEYCHAIN_PATH" -f pemseq -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          SIGNING_IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$SIGNING_IDENTITIES"
          if [[ "$SIGNING_IDENTITIES" != *"Apple Distribution:"* ]]; then
            echo "::error::No valid Apple Distribution codesigning identity was imported into the temporary keychain."
            exit 1
          fi

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")"
          PROFILE_APPLICATION_IDENTIFIER="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST")"
          test "$PROFILE_NAME" = "COP Italy App Store"
          test "$PROFILE_APPLICATION_IDENTIFIER" = "$APPLE_TEAM_ID.com.peniel.platform"

          PROFILE_INSTALL_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          mkdir -p "$(dirname "$PROFILE_INSTALL_PATH")"
          cp "$PROFILE_PATH" "$PROFILE_INSTALL_PATH"

          {
            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "PROFILE_INSTALL_PATH=$PROFILE_INSTALL_PATH"
          } >> "$GITHUB_ENV"

      - name: Archive the App Store build
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_NUMBER" -gt 0
          MARKETING_VERSION="$(
            xcodebuild -showBuildSettings \
              -project ios/App/App.xcodeproj \
              -scheme App \
              -configuration Release \
              | awk -F ' = ' '/^[[:space:]]*MARKETING_VERSION = / { print $2; exit }'
          )"
          test -n "$MARKETING_VERSION"
          printf 'iOS marketing version: %s\n' "$MARKETING_VERSION"
          printf 'iOS build number: %s\n' "$GITHUB_RUN_NUMBER"

          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/COP-Italy.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="com.peniel.platform" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="COP Italy App Store"

      - name: Export App Store Connect IPA
        shell: bash
        run: |
          set -euo pipefail
          EXPORT_OPTIONS_PLIST="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS_PLIST" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.peniel.platform</key>
              <string>COP Italy App Store</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/COP-Italy.xcarchive" \
            -exportPath "$RUNNER_TEMP/COP-Italy-export" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST"

      - name: Upload IPA to TestFlight
        shell: bash
        run: |
          set -euo pipefail
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          API_KEY_PATH="$API_KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          IPA_PATH="$RUNNER_TEMP/COP-Italy-export/App.ipa"

          mkdir -p "$API_KEY_DIR"
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          test -f "$IPA_PATH"

          xcrun iTMSTransporter \
            -m upload \
            -assetFile "$IPA_PATH" \
            -apiKey "$APP_STORE_CONNECT_KEY_ID" \
            -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Remove signing assets
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "${PROFILE_INSTALL_PATH:-}"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          security delete-keychain "${KEYCHAIN_PATH:-$RUNNER_TEMP/cop-italy-build.keychain-db}" || true
          rm -f "$RUNNER_TEMP/cop-italy-ios-signing/distribution.p12"
          rm -f "$RUNNER_TEMP/cop-italy-ios-signing/distribution-key.pem"
          rm -f "$RUNNER_TEMP/cop-italy-ios-signing/distribution-certificate.pem"
          rm -f "$RUNNER_TEMP/cop-italy-ios-signing/distribution-identity.pem"
          rm -f "$RUNNER_TEMP/cop-italy-ios-signing/app-store.mobileprovision"
          rm -f "$RUNNER_TEMP/cop-italy-ios-signing/profile.plist"
          rmdir "$RUNNER_TEMP/cop-italy-ios-signing" 2>/dev/null || true
